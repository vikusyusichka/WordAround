# WordAround — Gemini proxy Cloudflare Worker.
#
# Deploy with:
#   wrangler deploy
#
# Set secrets (NEVER commit them to this file):
#   wrangler secret put GEMINI_API_KEY      # Gemini proxy + shadowing phrases
#   wrangler secret put UNSPLASH_ACCESS_KEY # Describe Picture random images
#   wrangler secret put AZURE_SPEECH_KEY    # Azure Pronunciation Assessment
#   wrangler secret put AZURE_SPEECH_REGION # e.g. westeurope

name = "wordaround-gemini-proxy"
main = "src/index.js"
compatibility_date = "2025-09-23"

# Keep the worker free-tier friendly: no Durable Objects, no R2, no D1.
# The only resource is the inbound fetch route handled inside `src/index.js`.
