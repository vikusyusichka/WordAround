# WordAround — Cloudflare Worker.
#
# This single Worker serves two routes:
#   POST /                     → Gemini text proxy (essay / quiz / hints)
#   POST /api/speaking/topic   → Groq-backed speaking-topic generator
#
# Deploy with:
#   wrangler deploy
#
# Set the provider secrets (NEVER commit them to this file):
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put GROQ_API_KEY

name = "wordaround-gemini-proxy"
main = "src/index.js"
compatibility_date = "2025-09-23"

# Keep the worker free-tier friendly: no Durable Objects, no R2, no D1.
# The only resource is the inbound fetch route handled inside `src/index.js`.
